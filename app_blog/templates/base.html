<!DOCTYPE html>
<html lang="uk">
{% load static %}
<head>
    <title>Персональний блог</title>
    <meta charset="utf-8">
    <!-- Підключення Bootstrap через CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <!-- Наш власний файл стилів -->
   <style>
        @import url('https://fonts.googleapis.com/css?family=Ubuntu');
        body {
            background-color: #2c3e50;
            color: #fff;
            font-family: 'Ubuntu', sans-serif;
        }
        div > h1 { color: #fff; }
        .article-block {
            background: #fff;
            color: #383838;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .article-block a { color: #09b3bf; text-decoration: none; }
        .article-block a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mt-4 mb-4 text-white">Персональний блог</h1>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
